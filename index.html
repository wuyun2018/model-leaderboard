<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>全球模型排行榜</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0f14;color:#e6edf3;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:40px}
header{padding:20px 16px 12px;background:linear-gradient(160deg,#111a26 0%,#0b0f14 100%);border-bottom:1px solid #1c2633;position:sticky;top:0;z-index:20}
h1{margin:0;font-size:19px;letter-spacing:-.3px}
h1 span{color:#58a6ff}
.sub{margin:6px 0 0;font-size:11.5px;color:#7d8590}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;
  padding:10px 12px 11px;background:#0b0f14;border-bottom:1px solid #1c2633;
  position:sticky;top:0;z-index:19}
.tab{display:flex;align-items:center;justify-content:center;gap:4px;
  padding:7px 4px;border-radius:9px;background:#161b22;border:1px solid #21262d;
  color:#9ba3ae;font-size:11.5px;line-height:1.2;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:.15s;
  -webkit-tap-highlight-color:transparent;user-select:none}
.tab:active{transform:scale(.97)}
.tab.on{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:600}
.tab .em{font-size:12px;flex:0 0 auto}
@media (max-width:340px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
main{padding:16px}
.lead{font-size:12.5px;color:#8b949e;margin:0 0 14px;padding-left:10px;border-left:3px solid #1f6feb;line-height:1.6}
.card{background:#11161d;border:1px solid #1c2633;border-radius:12px;overflow:hidden;margin-bottom:14px}
.card>h3{margin:0;padding:11px 13px;font-size:13px;font-weight:600;color:#c9d1d9;background:#151b24;border-bottom:1px solid #1c2633}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
th,td{padding:0 9px;box-sizing:border-box}
th{text-align:left;padding-top:8px;padding-bottom:8px;color:#6e7681;font-weight:500;font-size:12px;
   background:#0f141a;border-bottom:1px solid #1c2633;white-space:nowrap;vertical-align:middle;
   font-family:inherit;letter-spacing:0;-webkit-text-size-adjust:100%}
th.c-num{text-align:right}
td{padding-top:9px;padding-bottom:9px;border-bottom:1px solid #161b22;vertical-align:top;overflow-wrap:anywhere;word-break:break-word;line-height:1.35}
tr:last-child td{border-bottom:none}
td.rk,th.rk{color:#6e7681;font-variant-numeric:tabular-nums;text-align:right;padding-left:2px;padding-right:6px}
th.c-num,td.sc{text-align:right}
td.mn{font-weight:500;color:#e6edf3;min-width:0}
td.org{color:#8b949e;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.sc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:#58a6ff;white-space:nowrap;font-size:11.5px}
tr.gold td.sc{color:#e3b341}
tr.gold td.mn::before{content:"★ ";color:#e3b341}
tr.mine{background:rgba(31,111,235,.10)}
tr.mine td.mn::after{content:" · 你有";font-size:10px;color:#1f6feb;font-weight:600;margin-left:5px}
.pick{background:#11161d;border:1px solid #1c2633;border-radius:12px;padding:13px;margin-bottom:10px}
.pick .t{font-size:12px;color:#8b949e;margin-bottom:7px}
.pick .f{font-size:16px;font-weight:700;color:#58a6ff;letter-spacing:-.2px}
.pick .a{font-size:12px;color:#8b949e;margin-top:3px}
.pick .a b{color:#c9d1d9;font-weight:600}
.pick .w{font-size:11.5px;color:#6e7681;margin-top:7px;padding-top:7px;border-top:1px dashed #21262d}
footer{padding:16px;font-size:11px;color:#565e68;line-height:1.7;border-top:1px solid #1c2633;margin-top:10px}
.legend{font-size:11px;color:#6e7681;margin:-4px 0 12px}
.legend b{color:#58a6ff}
</style>
</head>
<body>
<header>
  <h1>全球模型排行榜 <span>·</span> 按用途分类</h1>
  <p class="sub">基准数据 <span id="d"></span> · 用量数据 <span id="ra"></span> · 源：Artificial Analysis（<span id="n"></span> 个活跃模型）+ OpenRouter + Design Arena</p>
</header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<footer>
  <b>读榜须知</b><br>
  ① 带 (Max)/(Xhigh)/(High) 的是同一模型的不同推理强度档位，分数差异很大，别混为一谈。<br>
  ② 带 <b>*</b> 的分数是 Artificial Analysis 的估算值，非官方实测。<br>
  ③ 🟢 代表开放权重（可自部署）。<br>
  ④ "智能指数"是 10 项基准加权综合分；单一维度任务请看对应分类，别只看总分。<br>
  ⑤ 真实用量榜反映生产环境实际选择，和分数榜经常对不上——便宜和快也是竞争力。
</footer>
<script src="manual.js?v=1792930159"></script>
<script src="realdata.js?v=1792930159"></script>
<script src="local.js?v=1792930159"></script>

<script src="auto.js?v=1792930159"></script>
<script>
const CATS = [PICK_CAT, ...AUTO_CATS, ...REAL_CATS, DESIGN_CAT];
const $ = s => document.querySelector(s);

// 归一化：全部压成小写字母数字，消除空格/连字符/点的差异
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const LOCAL_NORM = [];
const LOCAL_SAFE = (typeof LOCAL === 'undefined' ? {} : LOCAL);   // local.js 不存在时自动降级
Object.entries(LOCAL_SAFE).forEach(([prov, arr]) => arr.forEach(n => LOCAL_NORM.push(norm(n))));

function isMine(name){
  const n = norm(name);
  return LOCAL_NORM.some(l => l.length >= 5 ? n.includes(l) : (n === l || n.startsWith(l)));
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// 厂商名缩写：等分列宽后长名会截断，这里做保守缩写
const ORG_SHORT = {
  'Institute of Foundation Models': 'Inst. of Found.',
  'Motif Technologies': 'Motif Tech',
  'Sapiens AI': 'Sapiens',
  'SpaceXAI': 'SpaceXAI'
};
function shortOrg(v){
  const t = String(v == null ? '' : v).trim();
  return ORG_SHORT[t] || t;
}

// 判定某一列是否为数字列：整列 ≥60% 的值带 %/$/数字 → 右对齐，表头同步右对齐
function numCol(rows, j){
  if(!rows.length) return false;
  let n = 0;
  rows.forEach(r => {
    const v = String(r[j] == null ? '' : r[j]).trim();
    if(v && /[%$]/.test(v) || /^[\d.,]+\s*[A-Za-z]*$/.test(v)) n++;
  });
  return n / rows.length >= 0.6;
}

function table(cols, rows, rank){
  // 每列对齐方式：第 0 列模型名左对齐，其余数字列右对齐
  const right = cols.map((c,j) => j === 0 ? false : (numCol(rows, j) || /token|数|变化|价格|分|率|ttft|吞吐|成本/i.test(c)));

  // 列宽 = 按列数等分。序号列（若有）也参与等分，不再单占 26px，
  // 这样「同样的列数」在所有板块里宽度完全一致，竖向扫视时列边界对得上。
  const n = cols.length + (rank ? 1 : 0);
  const w = (100 / n).toFixed(4) + '%';

  let h = '<table><colgroup>';
  for(let k = 0; k < n; k++) h += `<col style="width:${w}">`;
  h += '</colgroup><thead><tr>';
  if(rank) h += '<th class="rk"></th>';
  cols.forEach((c,j) => h += `<th class="${right[j] ? 'c-num' : ''}">${esc(c)}</th>`);
  h += '</tr></thead><tbody>';
  rows.forEach((r,i) => {
    const name = r[0];
    const cls = i < 3 ? 'gold' : (isMine(name) ? 'mine' : '');
    h += `<tr class="${cls}">`;
    if(rank) h += `<td class="rk">${i+1}</td>`;
    r.forEach((cell,j) => {
      const c = j === 0 ? 'mn' : (right[j] ? 'sc' : (j === 1 ? 'org' : ''));
      const v = j === 1 ? shortOrg(cell) : cell;
      h += `<td class="${c}">${esc(v)}</td>`;
    });
    h += '</tr>';
  });
  return h + '</tbody></table>';
}

function render(id){
  const cat = CATS.find(c => c.id === id);
  const m = $('#main');
  let h = `<p class="lead">${esc(cat.desc)}</p>`;

  if(cat.kind === 'pick'){
    cat.picks.forEach(p => {
      h += `<div class="pick">
        <div class="t">${esc(p.task)}</div>
        <div class="f">${esc(p.first)}</div>
        <div class="a">备选 <b>${esc(p.alt)}</b></div>
        <div class="w">${esc(p.why)}</div>
      </div>`;
    });
  } else if(cat.kind === 'list'){
    h += `<p class="legend">★ 前三 · <b>蓝色高亮</b> = 你本地已配置</p>`;
    h += `<div class="card">${table(cat.cols, cat.rows, true)}</div>`;
  } else {
    h += `<p class="legend">★ 前三 · <b>蓝色高亮</b> = 你本地已配置</p>`;
    cat.groups.forEach(g => {
      h += `<div class="card"><h3>${esc(g.title)}</h3>${table(g.cols, g.rows, true)}</div>`;
    });
  }
  m.innerHTML = h;
  window.scrollTo({top:0,behavior:'instant'});
}

const tabs = $('#tabs');
CATS.forEach((c,i) => {
  const b = document.createElement('div');
  b.className = 'tab' + (i===0?' on':'');
  // 名称形如「🎯 场景速查」，emoji 单独成 span，窄屏下优先保住文字
  const parts = String(c.name).split(' ');
  if(parts.length > 1 && parts[0].length <= 4){
    b.innerHTML = `<span class="em">${parts[0]}</span><span>${esc(parts.slice(1).join(' '))}</span>`;
  } else {
    b.textContent = c.name;
  }
  b.title = c.name;
  b.onclick = () => {
    [...tabs.children].forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    render(c.id);
  };
  tabs.appendChild(b);
});
$('#d').textContent = DATA_DATE;
$('#ra').textContent = (typeof REAL_ASOF === 'undefined' ? DATA_DATE : REAL_ASOF);
$('#n').textContent = MODEL_COUNT;
document.title = '全球模型排行榜 · ' + DATA_DATE;
render(CATS[0].id);
</script>
</body>
</html>
