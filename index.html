<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>全球模型排行榜</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0f14;color:#e6edf3;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:40px}
header{padding:20px 16px 12px;background:linear-gradient(160deg,#111a26 0%,#0b0f14 100%);border-bottom:1px solid #1c2633;position:sticky;top:0;z-index:20}
h1{margin:0;font-size:19px;letter-spacing:-.3px}
h1 span{color:#58a6ff}
.sub{margin:6px 0 0;font-size:11.5px;color:#7d8590}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;
  padding:10px 12px 11px;background:#0b0f14;border-bottom:1px solid #1c2633;
  position:sticky;top:var(--hdr,0px);z-index:19}
.tab{display:flex;align-items:center;justify-content:center;gap:4px;
  padding:7px 4px;border-radius:9px;background:#161b22;border:1px solid #21262d;
  color:#9ba3ae;font-size:11.5px;line-height:1.2;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:.15s;
  -webkit-tap-highlight-color:transparent;user-select:none}
.tab:active{transform:scale(.97)}
.tab.on{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:600}
.tab .em{font-size:12px;flex:0 0 auto}
@media (max-width:340px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
main{padding:16px}
.lead{font-size:12.5px;color:#8b949e;margin:0 0 14px;padding-left:10px;border-left:3px solid #1f6feb;line-height:1.6}
.card{background:#11161d;border:1px solid #1c2633;border-radius:12px;overflow:hidden;margin-bottom:14px}
.card>h3{margin:0;padding:11px 13px;font-size:13px;font-weight:600;color:#c9d1d9;background:#151b24;border-bottom:1px solid #1c2633}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
th,td{padding:0 9px;box-sizing:border-box}
th{text-align:left;padding-top:8px;padding-bottom:8px;color:#6e7681;font-weight:500;font-size:12px;
   background:#0f141a;border-bottom:1px solid #1c2633;white-space:nowrap;vertical-align:middle;
   font-family:inherit;letter-spacing:0;-webkit-text-size-adjust:100%}
th.c-num{text-align:left}
td{padding-top:9px;padding-bottom:9px;border-bottom:1px solid #161b22;vertical-align:top;overflow-wrap:anywhere;word-break:break-word;line-height:1.35}
tr:last-child td{border-bottom:none}
td.rk,th.rk{color:#6e7681;font-variant-numeric:tabular-nums;text-align:left;padding-left:9px;padding-right:9px}
th.c-num,td.sc{text-align:left}
td.mn{font-weight:500;color:#e6edf3;min-width:0;text-align:left;overflow-wrap:anywhere}
td.org{color:#8b949e;font-size:11.5px;overflow-wrap:anywhere;text-align:left}
td.sc{text-align:left;font-variant-numeric:tabular-nums;font-weight:600;color:#58a6ff;font-size:11.5px;overflow-wrap:anywhere}
tr.gold td.sc{color:#e3b341}
tr.gold td.mn::before{content:"★ ";color:#e3b341}
tr.mine{background:rgba(31,111,235,.10)}
tr.mine td.mn::after{content:" · 你有";font-size:10px;color:#1f6feb;font-weight:600;margin-left:5px}
.pick{background:#11161d;border:1px solid #1c2633;border-radius:12px;padding:13px;margin-bottom:10px}
.pick .t{font-size:12px;color:#8b949e;margin-bottom:7px}
.pick .f{font-size:16px;font-weight:700;color:#58a6ff;letter-spacing:-.2px}
.pick .a{font-size:12px;color:#8b949e;margin-top:3px}
.pick .a b{color:#c9d1d9;font-weight:600}
.pick .w{font-size:11.5px;color:#6e7681;margin-top:7px;padding-top:7px;border-top:1px dashed #21262d}
footer{padding:16px;font-size:11px;color:#565e68;line-height:1.7;border-top:1px solid #1c2633;margin-top:10px}
.legend{font-size:11px;color:#6e7681;margin:-4px 0 12px}
.legend b{color:#58a6ff}

/* ── 窄屏优化 ──────────────────────────────────────────────
   目标：≤420px 收紧外边距与单元格内边距；≤360px 进一步压缩，
   让同一张表在小屏上多出 30–40px 可用宽度，减少折行与行高抖动。
   字号同步降一档，textPx() 会用运行时 computed 字号重新测量，
   因此列宽分配会跟着自动收紧，不需要写死任何像素。          */
@media (max-width:420px){
  main{padding:12px}
  .card>h3{padding:9px 11px;font-size:12.5px}
  footer{padding:14px 12px}
  table{font-size:11.5px}
  th,td{padding-left:7px;padding-right:7px}
  th{padding-top:7px;padding-bottom:7px}
  td{padding-top:8px;padding-bottom:8px}
  td.sc,td.org{font-size:11px}
  /* 分类栏 4 列 3 行：比默认的 3 列 4 行省约 35px 纵向空间 */
  .tabs{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:8px 10px 9px}
  .tab{font-size:10.5px;padding:6px 2px;border-radius:9px;gap:2px}
  .tab .em{font-size:11.5px}
}
@media (max-width:360px){
  main{padding:9px}
  .card{border-radius:10px}
  .card>h3{padding:8px 9px;font-size:12px}
  .lead{font-size:12px;padding-left:8px;margin-bottom:11px}
  table{font-size:11px}
  th,td{padding-left:5px;padding-right:5px}
  th{padding-top:6px;padding-bottom:6px}
  td{padding-top:7px;padding-bottom:7px;line-height:1.3}
  td.sc,td.org{font-size:10.5px}
  td.rk,th.rk{padding-left:4px;padding-right:4px}
  .card{margin-bottom:11px}
  /* ≤360 才用单行省略：这尺寸下模型名放不全，(Max) 档位截断也比折成三行好读；
     名字列的 title 属性保留全称，长按/悬停可看 */
  td.mn,td.org{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 标题随内容滚走，只留分类栏常驻，把纵向空间全让给表格 */
  header{position:static;padding:12px 9px 9px}
  h1{font-size:16px;letter-spacing:-.2px}
  .sub{font-size:10px;margin-top:4px;line-height:1.45}
  /* 分类栏 3 列紧凑排布，从 6 行压到 4 行（215px → 约 120px） */
  .tabs{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:7px 8px 8px}
  .tab{font-size:10.5px;padding:6px 2px;border-radius:8px;gap:3px}
  .tab .em{font-size:11px}
}
@media (max-width:320px){
  main{padding:7px}
  table{font-size:10.5px}
  th,td{padding-left:4px;padding-right:4px}
  td.mn{font-size:10.5px}
}
</style>
</head>
<body>
<header>
  <h1>全球模型排行榜 <span>·</span> 按用途分类</h1>
  <p class="sub">基准数据 <span id="d"></span> · 用量数据 <span id="ra"></span> · 源：Artificial Analysis（<span id="n"></span> 个活跃模型）+ OpenRouter + Design Arena</p>
</header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<footer>
  <b>读榜须知</b><br>
  ① 带 (Max)/(Xhigh)/(High) 的是同一模型的不同推理强度档位，分数差异很大，别混为一谈。<br>
  ② 带 <b>*</b> 的分数是 Artificial Analysis 的估算值，非官方实测。<br>
  ③ 🟢 代表开放权重（可自部署）。<br>
  ④ "智能指数"是 10 项基准加权综合分；单一维度任务请看对应分类，别只看总分。<br>
  ⑤ 真实用量榜反映生产环境实际选择，和分数榜经常对不上——便宜和快也是竞争力。
</footer>

<script src="local.js?v=1792976512"></script>

<script src="auto.js?v=1792976512"></script>
<script>
const CATS = [PICK_CAT, ...AUTO_CATS, ...REAL_CATS, DESIGN_CAT];
const $ = s => document.querySelector(s);

// 归一化：全部压成小写字母数字，消除空格/连字符/点的差异
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const LOCAL_NORM = [];
const LOCAL_SAFE = (typeof LOCAL === 'undefined' ? {} : LOCAL);   // local.js 不存在时自动降级
Object.entries(LOCAL_SAFE).forEach(([prov, arr]) => arr.forEach(n => LOCAL_NORM.push(norm(n))));

function isMine(name){
  const n = norm(name);
  return LOCAL_NORM.some(l => l.length >= 5 ? n.includes(l) : (n === l || n.startsWith(l)));
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// 厂商名缩写：等分列宽后长名会截断，这里做保守缩写
const ORG_SHORT = {
  'Institute of Foundation Models': 'Inst. of Found.',
  'Motif Technologies': 'Motif Tech',
  'Sapiens AI': 'Sapiens',
  'SpaceXAI': 'SpaceXAI'
};
function shortOrg(v){
  const t = String(v == null ? '' : v).trim();
  return ORG_SHORT[t] || t;
}

// 判定某一列是否为数字列：整列 ≥60% 的值带 %/$/数字 → 右对齐，表头同步右对齐
function numCol(rows, j){
  if(!rows.length) return false;
  let n = 0;
  rows.forEach(r => {
    const v = String(r[j] == null ? '' : r[j]).trim();
    if(v && /[%$]/.test(v) || /^[\d.,]+\s*[A-Za-z]*$/.test(v)) n++;
  });
  return n / rows.length >= 0.6;
}

// 单个字符的实际像素宽度：中文站默认 12px 字号，页面缩放会把它压小，
// 用运行时实测值而不是写死 6.4，避免窄屏下算出来放得下、实际却溢出。
// 单段文本的真实渲染宽度（像素）。canvas 不可用时退回字符计数 × 6.4。
var _ctxCache = null;
var _ctxFont = '';
function measureCtx(){
  var t0 = document.querySelector('#main table tbody td');
  var fs0 = t0 ? getComputedStyle(t0).fontSize : '12px';
  // 断点切换导致字号变化时，旧上下文量出来的宽度作废，必须重建
  if(_ctxCache && _ctxFont === fs0) return _ctxCache;
  var cs = t0 ? getComputedStyle(t0) : null;
  var fs = fs0;
  try{
    var cv = document.createElement('canvas');
    var ctx = cv.getContext('2d');
    ctx.font = (cs ? cs.fontStyle + ' ' + cs.fontWeight + ' ' : '') + fs + ' ' + (cs ? cs.fontFamily : 'sans-serif');
    _ctxCache = ctx; _ctxFont = fs0;
  }catch(e){ _ctxCache = false; _ctxFont = ''; }
  return _ctxCache;
}

function textPx(v){
  v = String(v == null ? '' : v);
  var ctx = measureCtx();
  if(ctx){
    var w = ctx.measureText(v).width;
    if(w > 0) return Math.ceil(w);
  }
  var n = 0;
  for(var i = 0; i < v.length; i++) n += v.charCodeAt(i) > 0x2E80 ? 2 : 1;
  return n * unit();
}

function unit(){
  var m = measuredCharPx();
  return m > 0 ? m : charPx();
}

function charPx(){
  var t = document.querySelector('#main table tbody td');
  var fs = t ? parseFloat(getComputedStyle(t).fontSize) : 12;
  return (isNaN(fs) || fs <= 0) ? 6.4 : fs * 0.533;
}

// 用 canvas 实测「当前字号下 1 个字符的平均像素宽」，着色后回写。
// 比例字体里 w/i/m 宽度差别很大，纯字符计数会有 ±20% 误差，窄屏直接导致溢出。
var _cpCache = null;
function measuredCharPx(){
  if(_cpCache) return _cpCache;
  var t = document.querySelector('#main table tbody td');
  if(!t) return charPx();
  var cs = getComputedStyle(t);
  try{
    var cv = document.createElement('canvas');
    var ctx = cv.getContext('2d');
    ctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    var n = ctx.measureText('abcdefghijklmnop').width / 16;
    if(n > 1 && n < 30){ _cpCache = n; return n; }
  }catch(e){}
  return charPx();
}

// 表格可用宽度：优先量真实表格，其次量容器，最后退回视口。
function measureWidth(){
  var t = document.querySelector('#main table');
  if(t){ var w = t.getBoundingClientRect().width; if(w > 40) return w; }
  var m = document.getElementById('main');
  if(m){ var w2 = m.clientWidth - 32; if(w2 > 40) return w2; }
  return Math.max(200, document.body.clientWidth - 34);
}

// 列宽计算：按各列内容实际需要的宽度分配，而不是一刀切等分。
//   1) 每列取「90 分位字符宽」作为需求（CJK 记 2、其他记 1），个别超长名不拖爆整列；
//   2) 需求开方压缩差距，得到初始权重，避免短列被压成一条缝；
//   3) 按当前客户端真实表格宽度换算成像素，逐列复核「文字 + 左右内边距」是否放得下，
//      放不下就补权重、其他列等比例让出，最多迭代 4 轮。
// 因为宽度来自运行时实测，手机 / 平板 / 桌面各自算各自的，无需媒体查询断点。
function colWeights(cols, rows, rank){
  var need = [];
  var minPx = [];
  if(rank){ need.push(30); minPx.push(26); }

  function cw(v){
    v = String(v == null ? '' : v);
    var w = 0;
    for(var i = 0; i < v.length; i++) w += v.charCodeAt(i) > 0x2E80 ? 2 : 1;
    return w;
  }

  // 需求 = 该列文本的真实渲染像素宽（canvas 实测字形，含比例字体差异）
  cols.forEach(function(c, j){
    var vals = rows.map(function(r){ return textPx(r[j]); });
    vals.push(textPx(c) * 1.05);               // 表头本身也要放得下
    vals.sort(function(a, b){ return a - b; });
    var q90 = vals[Math.min(vals.length - 1, Math.floor(vals.length * 0.9))];
    // 下限 34px：保证表头和短数字（如 +7%、28）不会被压成一条缝
    need.push(Math.max(34, q90));
    minPx.push(j === 0 ? 30 : 40);
  });

  // 厂商列按「未缩写的最长名」算需求，避免 shortOrg 缩了文本仍被挤爆
  if(cols.length > 1){
    // 用 75 分位而不是最大值：少数超长厂商名走省略号，不为此把整列拉宽
    var idx = rank ? 2 : 1, ov = [];
    rows.forEach(function(r){ ov.push(textPx(shortOrg(r[1]))); });
    ov.sort(function(a, b){ return a - b; });
    var q = ov[Math.min(ov.length - 1, Math.floor(ov.length * 0.75))];
    if(q > need[idx]) need[idx] = q;
  }

  // 真实字形校准：用 canvas 量一次「单位字符」的实际像素宽，
  // 修正「CJK=2 / 其他=1」字符计数与实际字宽的偏差（比例字体下误差可达 20%）。
  var avg = need.reduce(function(a, b){ return a + b; }, 0) / need.length;
  if(!need.length) return [];
  var k = need.map(function(x){ return Math.sqrt(Math.max(x, 6) / Math.max(avg, 6)); });

  // 需求本身按字符计，先算总需求，超宽时整体等比压缩（而不是让某一列被挤成一条缝）
  var tw = measureWidth();
  if(tw > 40){
    var avail = Math.max(60, tw - 18 * need.length);   // 扣掉每列左右 9px 内边距
    var sumNeed = need.reduce(function(a, b){ return a + b; }, 0);
    // 每列上限 = 可用宽度按需等比分配后能拿到的最大值（单位：像素）
    var avgNeed = sumNeed / need.length;
    var cap = Math.max(avgNeed * 1.6, avail / need.length);   // 上限：均分宽度的 1.6 倍
    for(var round = 0; round < 4; round++){
      var tot = k.reduce(function(a, b){ return a + b; }, 0);
      var px = k.map(function(x){ return avail * x / tot; });
      var fix = false, deficit = 0;
      for(var i = 0; i < need.length; i++){
        var want = Math.min(need[i], cap);        // 受上限约束后的期望宽度
        if(px[i] < want - 0.5){ deficit += want - px[i]; fix = true; }
      }
      if(!fix) break;
      // 只给缺得最多的列补权重：按缺口比例一次性补，其余列在下一轮归一化时等比例让出
      var tot2 = k.reduce(function(a, b){ return a + b; }, 0);
      for(var i2 = 0; i2 < need.length; i2++){
        var w2 = Math.min(need[i2], cap) * 6.4;
        if(px[i2] < w2 - 0.5){
          k[i2] *= 1 + (w2 - px[i2]) / Math.max(avail * k[i2] / tot2, 1);
        }
      }
    }
  }
  // 最终分配：先固化每列「必须的最小像素」，剩余宽度按需求比例分给各列，
  // 然后再把低于最小值的列抬到最小值，多出的差额从最宽的列按比例扣回。
  // 全程线性计算，不做迭代，因此结果单调、可控。
  var tw3 = measureWidth();
  if(tw3 > 40){
    var avail3 = Math.max(80, tw3 - 18 * need.length);
    var nCol = need.length;
    // 最小宽度 = 该列 90 分位文字宽 + 内边距 + 2px 余量（单格字形差异留缓冲）
    var hardMin = need.map(function(x){ return Math.min(x + 20, avail3 * 0.45); });
    var sumMin = hardMin.reduce(function(a, b){ return a + b; }, 0);
    var sumN3 = need.reduce(function(a, b){ return a + b; }, 0);

    if(sumMin >= avail3){
      // 极端窄屏：连最小宽度都放不下，直接按最小宽度等比例缩
      k = hardMin.slice();
    } else {
      var extra = avail3 - sumMin;
      k = need.map(function(x, i){ return hardMin[i] + extra * (x / Math.max(sumN3, 1)); });
      // 回收：最宽的列最多不超过「均分宽度 × 2.2」，超出部分再分给其余列
      var capW = avail3 / nCol * 2.2;
      for(var r3 = 0; r3 < 6; r3++){
        var over = 0;
        for(var i5 = 0; i5 < nCol; i5++){
          if(k[i5] > capW){ over += k[i5] - capW; k[i5] = capW; }
        }
        if(over <= 0.5) break;
        var smallSum = 0;
        for(var i6 = 0; i6 < nCol; i6++){ if(k[i6] < capW) smallSum += need[i6]; }
        if(smallSum <= 0) break;
        for(var i7 = 0; i7 < nCol; i7++){
          if(k[i7] < capW) k[i7] += over * need[i7] / smallSum;
        }
      }
    }
    // 序号列只是 1-2 位数字，不该和其他列平分剩余宽度。
    // 压到 26px 后，省下来的宽度会按比例自动流向其余列。
    if(rank) k[0] = Math.min(k[0], 26);
    return k;                                       // 像素权重，table() 归一化成百分比
  }
  return k.map(function(x){ return Math.min(6, Math.max(0.2, x)); });
}

function table(cols, rows, rank){
  // 所有列一律左对齐（含序号列与数值列）。
  // 列宽 = 表格实际宽度 ÷ 列数，等宽分割；由 CSS table-layout:fixed 在渲染时
  // 按当前客户端真实宽度计算，因此手机/平板/桌面打开都自动适配，无需断点。
  const n = cols.length + (rank ? 1 : 0);
  const wts = colWeights(cols, rows, rank);
  const tot = wts.reduce(function(a,b){return a+b;}, 0);

  let h = '<table><colgroup>';
  wts.forEach(function(x){ h += `<col style="width:${(x / tot * 100).toFixed(4)}%">`; });
  h += '</colgroup><thead><tr>';
  if(rank) h += '<th class="rk"></th>';
  cols.forEach((c,j) => h += `<th class="${j > 0 ? 'c-num' : ''}">${esc(c)}</th>`);
  h += '</tr></thead><tbody>';
  rows.forEach((r,i) => {
    const name = r[0];
    const cls = i < 3 ? 'gold' : (isMine(name) ? 'mine' : '');
    h += `<tr class="${cls}">`;
    if(rank) h += `<td class="rk">${i+1}</td>`;
    r.forEach((cell,j) => {
      const c = j === 0 ? 'mn' : (j === 1 ? 'org' : 'sc');
      const v = j === 1 ? shortOrg(cell) : String(cell).replace(/ \/ /g, '/');
      // 名字列极窄屏会被省略号截断，挂 title 让长按/悬停能看到全称
      const tip = (j === 0 || j === 1) ? ` title="${esc(cell)}"` : '';
      // 断行点：只在 / 与 @ 之后放 <wbr>，避免数字串被 word-break 从中间劈开
      const shown = c === 'sc'
        ? esc(v).replace(/(\/|@)/g, '$1<wbr>')
        : esc(v);
      h += `<td class="${c}"${tip}>${shown}</td>`;
    });
    h += '</tr>';
  });
  return h + '</tbody></table>';
}

function render(id){
  const cat = CATS.find(c => c.id === id);
  const m = $('#main');
  let h = `<p class="lead">${esc(cat.desc)}</p>`;

  if(cat.kind === 'pick'){
    cat.picks.forEach(p => {
      h += `<div class="pick">
        <div class="t">${esc(p.task)}</div>
        <div class="f">${esc(p.first)}</div>
        <div class="a">备选 <b>${esc(p.alt)}</b></div>
        <div class="w">${esc(p.why)}</div>
      </div>`;
    });
  } else if(cat.kind === 'list'){
    h += `<p class="legend">★ 前三 · <b>蓝色高亮</b> = 你本地已配置</p>`;
    h += `<div class="card">${table(cat.cols, cat.rows, true)}</div>`;
  } else {
    h += `<p class="legend">★ 前三 · <b>蓝色高亮</b> = 你本地已配置</p>`;
    cat.groups.forEach(g => {
      h += `<div class="card"><h3>${esc(g.title)}</h3>${table(g.cols, g.rows, true)}</div>`;
    });
  }
  m.innerHTML = h;
  window.scrollTo({top:0,behavior:'instant'});
}

const tabs = $('#tabs');
CATS.forEach((c,i) => {
  const b = document.createElement('div');
  b.className = 'tab' + (i===0?' on':'');
  // 名称形如「🎯 场景速查」，emoji 单独成 span，窄屏下优先保住文字
  const parts = String(c.name).split(' ');
  if(parts.length > 1 && parts[0].length <= 4){
    b.innerHTML = `<span class="em">${parts[0]}</span><span>${esc(parts.slice(1).join(' '))}</span>`;
  } else {
    b.textContent = c.name;
  }
  b.title = c.name;
  b.onclick = () => {
    [...tabs.children].forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    render(c.id);
  };
  tabs.appendChild(b);
});
$('#d').textContent = DATA_DATE;
$('#ra').textContent = (typeof REAL_ASOF === 'undefined' ? DATA_DATE : REAL_ASOF);
$('#n').textContent = MODEL_COUNT;
document.title = '全球模型排行榜 · ' + DATA_DATE;
render(CATS[0].id);

// 视口宽度变化（旋转屏、拖动窗口、分屏）后重算列宽。
// 列宽是运行时按真实宽度算的，不重算会沿用旧视口的分配结果。
// header 高度随断点变化，tabs 的 sticky 位置跟着同步，避免两层 sticky 互相遮挡
function syncStickyTop(){
  const hd = document.querySelector('header');
  const st = getComputedStyle(hd).position;
  const h = (st === 'sticky' || st === 'fixed') ? hd.getBoundingClientRect().height : 0;
  document.documentElement.style.setProperty('--hdr', Math.round(h) + 'px');
}
syncStickyTop();
window.addEventListener('load', syncStickyTop);

let _lastVW = window.innerWidth, _rsTimer = 0;
window.addEventListener('resize', () => {
  if(Math.abs(window.innerWidth - _lastVW) < 8) return;
  clearTimeout(_rsTimer);
  _rsTimer = setTimeout(() => {
    _lastVW = window.innerWidth;
    _ctxCache = null; _ctxFont = '';
    syncStickyTop();
    const on = document.querySelector('.tab.on');
    const idx = on ? [...tabs.children].indexOf(on) : 0;
    render(CATS[Math.max(0, idx)].id);
  }, 120);
});
</script>
</body>
</html>
